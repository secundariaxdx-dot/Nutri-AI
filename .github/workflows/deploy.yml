name: Desplegar en GitHub Pages

on:
  push:
    # main es la rama habitual; se incluye también la rama de desarrollo actual
    # mientras no exista main en el repositorio.
    branches: [main, claude/confident-carson-lx509q]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci
        env:
          # La app usa ONNX solo en el navegador; no hace falta el binario de GPU de Node
          # (su descarga devuelve 404 y rompe la instalación).
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip

      - name: Pruebas automatizadas
        run: npm test

      - name: Compilar
        run: npm run build
        env:
          # La app se publica en https://<usuario>.github.io/<repositorio>/
          VITE_BASE: /${{ github.event.repository.name }}/
          # Opcionales: define estos "Repository variables" en Settings › Secrets and variables › Actions › Variables
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_USDA_API_KEY: ${{ vars.VITE_USDA_API_KEY }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
